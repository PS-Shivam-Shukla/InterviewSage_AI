version: '3.8'

services:
  # =========================================================
  # Frontend Web & Nginx Reverse Proxy
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewsage-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interviewsage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =========================================================
  # FastAPI Backend Engine
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewsage-backend
    expose:
      - "8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-interviewsage}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password_2026}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_2026}@postgres:5432/${POSTGRES_DB:-interviewsage}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_2026_enterprise}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interviewsage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =========================================================
  # PostgreSQL 16 Database
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: interviewsage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewsage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviewsage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interviewsage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # Redis 7 Cache & WebSocket Pub/Sub
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: interviewsage-redis
    volumes:
      - redis_data:/data
    networks:
      - interviewsage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # Optional Local LLM (Ollama) Profile
  # =========================================================
  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    container_name: interviewsage-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - interviewsage-net
    restart: unless-stopped

networks:
  interviewsage-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  ollama_data:
    driver: local
