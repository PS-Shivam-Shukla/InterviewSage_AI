[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
markers =
    unit: Unit tests for individual components
    integration: Integration tests for services and endpoints
    workflow: LangGraph workflow engine tests
    agent: AI Agent prompt and execution tests
    repository: Database repository CRUD tests
    mcp: Model Context Protocol server and tool tests
    slow: Slow running tests requiring external dependencies
asyncio_mode = auto
filterwarnings =
    ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore::DeprecationWarning
    ignore::UserWarning
