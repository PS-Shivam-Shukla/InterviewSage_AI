[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # Line too long (handled by Black)
    "RUF059", # Unused variables in tuple unpacking
    "B017", # Blind exception assertions in pytest
    "SIM117", # Nested with statements in test client contexts
    "SIM102", # Nested if statements
    "SIM115", # Open files without context manager in tests
    "B007", # Unused loop control variable
    "F841", # Local variable assigned to but never used
    "SIM103", # Return boolean condition directly
    "RUF012", # Mutable default value for class attribute
    "RUF001", # Ambiguous unicode character in string
    "RUF002", # Ambiguous unicode character in docstring
    "SIM108", # Prefer ternary operator over if-else
    "E402", # Module level import not at top of file
    "RUF013", # Implicit Optional type hint
    "B905", # zip() without strict= parameter
    "B904", # raise ... from err in except clause
    "UP042", # Class inherits from str, Enum
    "RUF046", # Unnecessary int cast
    "RUF005", # Iterable unpacking suggestion
    "RUF015", # Prefer next(iter()) over list()[0]
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
pretty = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "fitz",
    "docx",
    "ftfy",
    "jose",
    "passlib.*",
    "langchain.*",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for services and endpoints",
    "slow: Slow running tests requiring external services or long execution",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::SyntaxWarning",
]
